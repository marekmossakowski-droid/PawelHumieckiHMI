name: runtime-ci

on:
  pull_request:
  push:
    branches:
      - main
      - implementation/**

permissions:
  contents: read

jobs:
  runtime-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Static Python compilation check
        run: python -m compileall -q src tests scripts
      - name: Install bounded portable test dependencies
        run: python -m pip install "mcp>=2,<3" "Pillow>=11,<13"
      - name: Run unit tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Generate local coverage report
        env:
          PYTHONPATH: src
        run: python scripts/run_coverage.py

  dtools-bridge-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install bounded Windows dependencies
        run: python -m pip install --requirement dtools/gl100e/bridge/requirements-windows.txt
      - name: Compile Bridge sources
        run: python -m compileall -q src tests scripts
      - name: Run portable and Windows emulator Bridge tests
        shell: pwsh
        run: |
          $env:PYTHONPATH = "src"
          python -m unittest tests.test_dtools_bridge_policy `
            tests.test_dtools_bridge_session `
            tests.test_dtools_bridge_audit `
            tests.test_dtools_bridge_controller `
            tests.test_dtools_bridge_server `
            tests.test_dtools_bridge_windows `
            tests.test_dtools_bridge_package -v
      - name: Build installable DTools Bridge
        shell: pwsh
        run: ./scripts/windows/dtools_bridge/Build-DToolsBridge.ps1
      - name: Publish installable DTools Bridge
        uses: actions/upload-artifact@v4
        with:
          name: HoofCare-DToolsBridge-Windows
          if-no-files-found: error
          retention-days: 7
          path: |
            dist/HoofCare.DToolsBridge
            dtools/gl100e/bridge/allowlist.json
            Install-HoofCare-DToolsBridge.cmd
            scripts/windows/dtools_bridge/Install-DToolsBridge.ps1
            scripts/windows/dtools_bridge/Upgrade-DToolsBridge.ps1
            scripts/windows/dtools_bridge/Run-DToolsBridge.cmd
            scripts/windows/dtools_bridge/Run-DToolsBridge-Automation.cmd
