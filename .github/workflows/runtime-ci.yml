name: runtime-ci

on:
  pull_request:
  push:
    branches:
      - main
      - implementation/**

permissions:
  contents: read

jobs:
  runtime-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Static Python compilation check
        run: python -m compileall -q src tests scripts
      - name: Install portable MCP contract dependency
        run: python -m pip install "mcp>=2,<3"
      - name: Run unit tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Generate local coverage report
        env:
          PYTHONPATH: src
        run: python scripts/run_coverage.py

  dtools-bridge-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install bounded Windows dependencies
        run: python -m pip install --requirement dtools/gl100e/bridge/requirements-windows.txt
      - name: Compile Bridge sources
        run: python -m compileall -q src tests scripts
      - name: Run portable and Windows emulator Bridge tests
        shell: pwsh
        run: |
          $env:PYTHONPATH = "src"
          python -m unittest tests.test_dtools_bridge_policy `
            tests.test_dtools_bridge_session `
            tests.test_dtools_bridge_audit `
            tests.test_dtools_bridge_controller `
            tests.test_dtools_bridge_server `
            tests.test_dtools_bridge_windows `
            tests.test_dtools_bridge_package -v
