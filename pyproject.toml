[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hoofcare-bench"
version = "0.1.0"
description = "HoofCare isolated synthetic bench runtime"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
hoofcare-bench = "hoofcare.runtime.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
